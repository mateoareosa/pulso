services:
  postgres:
    image: postgres:16-alpine
    container_name: pulso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: pulso_dev_password
      POSTGRES_DB: pulso_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pulso -d pulso_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    container_name: pulso-postgres-test
    profiles:
      - test
    environment:
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: pulso_test_password
      POSTGRES_DB: pulso_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pulso -d pulso_test']
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
